[package]
name = "reticulumchat"
version = "0.7.0"
edition = "2021"
authors = ["ReticulumChat Contributors"]
description = "A chat client for the Reticulum mesh network"
license = "MIT"
repository = "https://github.com/reticulumchat/reticulumchat"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
age = { version = "0.11", features = ["armor"] }
notify-rust = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backtrace = "0.3"
shellexpand = "3.1"

[dev-dependencies]
tempfile = "3.14"

[features]
default = ["gui"]
gui = ["eframe", "egui"]

[[bin]]
name = "reticulumchat"
path = "src/main.rs"
